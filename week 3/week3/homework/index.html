<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Bake Gallery</title>
</head>
<body>
    <header>
        <p id="logo">VARSHINI BAKES</p>
        <nav>
            <a href="#">Home</a>
            <a href="#">Gallery</a>
            <a href="#">Recipes</a>
            <a href="#">About</a>
        </nav>
    </header>

    <main id="gallery">
        <section id="thumbnails">
            <img src="images/bake1.jpg" alt="brownies" id="thumb1" class="thumb">
            <img src="images/bake2.jpg" alt="chocolate chip cookies" id="thumb2" class="thumb">
            <img src="images/bake3.jpg" alt="cinnamon rolls" id="thumb3" class="thumb">
            <img src="images/bake4.jpg" alt="banana bread" id="thumb4" class="thumb">
        </section>

        <section id="display">
            <img src="images/bake1.jpg" alt="brownies" id="bigImage">
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
